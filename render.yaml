# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: voltrace
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Long random secret generated by Render once; the Ed25519 signing key is derived from it,
      # so it stays the same across restarts and never appears in the repository.
      - key: VOLTRACE_SIGNING_SEED
        generateValue: true
      # Optional: persist passports in Supabase (otherwise an ephemeral SQLite file is used).
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_KEY
      #   sync: false
